# Cloudflare Pages configuration.
#
# nodejs_compat is REQUIRED once the Stripe SDK is used by src/pages/api/*.ts:
# it pulls in Node built-ins the Workers runtime does not expose by default.
# Set the same flag in the Pages dashboard (Settings → Functions).
name = "thedivinevine"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# D1 (orders, bookings, newsletter). Locally this is a SQLite file under
# .wrangler/state, created by `npm run db:migrate` (also run by `npm run dev`).
# Replace database_id with the real one from `wrangler d1 create thedivinevine`
# before the first deploy.
[[d1_databases]]
binding = "DB"
database_name = "thedivinevine"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
